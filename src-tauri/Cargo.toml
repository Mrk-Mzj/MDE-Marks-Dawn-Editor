[package]
name = "mde"
version = "1.0.0"
description = "Mark's Dawn Editor - a fast, lightweight Markdown editor"
edition = "2021"
authors = ["Marek Mazij"]
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Rebuilds the webview's right-click menu (src/context_menu.rs); the same version Tauri already uses.
webview2-com = "0.39"
# Windows Spell Checking API (src/spell.rs), ShellExecute for opening links (src/main.rs)
# and the native window buttons (src/caption.rs: GDI drawing, tooltips, DPI, mouse tracking).
windows = { version = "0.62", features = [
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
