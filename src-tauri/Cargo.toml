[package]
name = "mde"
version = "0.1.0"
description = "Mark's Dawn Editor - a fast, lightweight Markdown editor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
