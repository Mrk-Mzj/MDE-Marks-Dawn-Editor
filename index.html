<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDE</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="topbar" data-slot="topbar">
      <div class="menu-anchor">
        <button id="menu-button" class="icon-button" data-slot="button" type="button" aria-label="Menu">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.875 5.375h16.25M3.875 12h16.25M3.875 18.625h16.25" />
          </svg>
        </button>
      </div>
      <div id="tabs" class="tabs" data-slot="tabs"></div>
    </header>
    <div id="notice" class="notice" data-slot="notice" role="status" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
        <path d="M12 9v4M12 17h.01" />
      </svg>
      <span id="notice-text" class="notice-text"></span>
      <div id="notice-actions" class="notice-actions" hidden></div>
      <button id="notice-close" class="icon-button notice-close" data-slot="button" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <main class="workspace">
      <section class="pane pane-editor" data-slot="editor-pane">
        <div id="toolbar" class="toolbar" data-slot="toolbar"></div>
        <div id="find" class="find-bar" data-slot="find-bar"></div>
        <div id="editor-area" class="editor-area">
          <div id="editor" class="editor-host"></div>
        </div>
      </section>
      <div class="pane-divider" role="separator" aria-orientation="vertical"></div>
      <section class="pane pane-preview" data-slot="preview-pane">
        <article id="preview" class="preview markdown-body"></article>
      </section>
    </main>
    <footer class="statusbar" data-slot="statusbar">
      <span id="char-count" class="status-text"></span>
      <button id="spell-status" class="status-button" data-slot="button" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.7 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.7-1.7l-3.6-3.6A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v9.3" />
          <path d="M14 2v5a1 1 0 0 0 1 1h5" />
          <path d="M10.4 12.6a1 1 0 0 1 3 3L8.4 20.6a2 2 0 0 1-.9.5l-2.9.8a.5.5 0 0 1-.6-.6l.8-2.9a2 2 0 0 1 .5-.9z" />
        </svg>
        <span id="spell-status-text"></span>
      </button>
      <button id="minimap-status" class="status-button" data-slot="button" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M7 7.5h10M7 12h6M7 16.5h8" />
        </svg>
        <span id="minimap-status-text"></span>
      </button>
      <button id="panes-status" class="status-button" data-slot="button" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="M10 4v4M2 8h20M6 4v4" />
        </svg>
        <span id="panes-status-text"></span>
      </button>
      <button id="sync-status" class="status-button" data-slot="button" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M12 3v18" />
        </svg>
        <span id="sync-status-text"></span>
      </button>
    </footer>
  </body>
</html>
