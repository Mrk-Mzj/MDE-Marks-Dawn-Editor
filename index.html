<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDE</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="topbar" data-slot="topbar">
      <div class="menu-anchor">
        <button id="menu-button" class="icon-button" data-slot="button" type="button" aria-label="Menu">
          <svg class="icon icon-px" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 4.5h12M2 8.5h12M2 12.5h12" />
          </svg>
        </button>
      </div>
      <div id="tabs" class="tabs" data-slot="tabs"></div>
      <div class="menu-anchor groups-anchor">
        <button id="groups-button" class="icon-button" data-slot="button" type="button">
          <!-- Drawn by the project owner on a 15×10px grid (3.125 units per pixel). -->
          <svg class="icon groups-icon" viewBox="0 0 46.875 31.25" aria-hidden="true">
            <path class="icon-fill" fill-rule="evenodd" d="M0,31.25l0,-31.25l25,0c5.174,0 9.375,4.201 9.375,9.375l12.5,-0l-12.5,21.875l-34.375,0Zm3.125,-3.125l29.437,0l8.929,-15.625l-7.115,0c-1.726,0 -3.125,-1.399 -3.125,-3.125c0,-3.449 -2.801,-6.25 -6.25,-6.25l-21.875,-0l-0,25Z" />
            <path class="icon-fill" d="M31.25,9.375l3.125,3.125l-20.061,-0l-8.929,15.625l-5.385,3.125l12.5,-21.875l18.75,0Z" />
          </svg>
        </button>
      </div>
    </header>
    <div id="notice" class="notice" data-slot="notice" role="status" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
        <path d="M12 9v4M12 17h.01" />
      </svg>
      <span id="notice-text" class="notice-text"></span>
      <div id="notice-actions" class="notice-actions" hidden></div>
      <button id="notice-close" class="icon-button notice-close" data-slot="button" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <main class="workspace">
      <section class="pane pane-editor" data-slot="editor-pane">
        <div id="toolbar" class="toolbar" data-slot="toolbar"></div>
        <div id="find" class="find-bar" data-slot="find-bar"></div>
        <div id="editor-area" class="editor-area">
          <div id="editor" class="editor-host"></div>
        </div>
      </section>
      <div class="pane-divider" role="separator" aria-orientation="vertical"></div>
      <section class="pane pane-preview" data-slot="preview-pane">
        <article id="preview" class="preview markdown-body"></article>
      </section>
    </main>
    <footer class="statusbar" data-slot="statusbar">
      <span id="char-count" class="status-text"></span>
      <button id="spell-status" class="status-button" data-slot="button" type="button">
        <svg class="icon icon-px" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8.5 14.5H12a1.5 1.5 0 0 0 1.5-1.5V5.5l-4-4H4A1.5 1.5 0 0 0 2.5 3v4" />
          <path d="M9.5 1.5v3a1 1 0 0 0 1 1h3" />
          <path d="M7 8.5a1.414 1.414 0 0 1 2 2l-3.25 3.25a1.4 1.4 0 0 1-.6.35l-1.95.55a.35.35 0 0 1-.43-.43l.55-1.95a1.4 1.4 0 0 1 .35-.6z" />
        </svg>
        <span id="spell-status-text"></span>
      </button>
      <button id="minimap-status" class="status-button" data-slot="button" type="button">
        <svg class="icon icon-px" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="1.5" y="2.5" width="12" height="12" rx="1.5" />
          <path d="M4 5.5h7M4 8.5h4M4 11.5h6" />
        </svg>
        <span id="minimap-status-text"></span>
      </button>
      <button id="panes-status" class="status-button" data-slot="button" type="button">
        <svg class="icon icon-px" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="1.5" y="3.5" width="13" height="10" rx="1.5" />
          <path d="M2 6.5h12M4.5 4v2M7.5 4v2" />
        </svg>
        <span id="panes-status-text"></span>
      </button>
      <button id="sync-status" class="status-button" data-slot="button" type="button">
        <svg class="icon icon-px" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="1.5" y="2.5" width="12" height="12" rx="1.5" />
          <path d="M7.5 3v11" />
        </svg>
        <span id="sync-status-text"></span>
      </button>
    </footer>
  </body>
</html>
